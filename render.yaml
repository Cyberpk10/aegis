# Render Blueprint (M8 Stage 1) — "New +" -> "Blueprint" in the Render dashboard, pointed at
# this repo, provisions both resources below in one step. See DEPLOYMENT.md for the full
# step-by-step walkthrough, including the manual (non-Blueprint) equivalent as a fallback.
#
# The DATABASE_URL fromDatabase wiring below produces a bare `postgresql://...` connection
# string — app.core.config.settings normalizes that to `postgresql+psycopg://...` at read
# time (this app depends on psycopg v3, not the legacy psycopg2 SQLAlchemy defaults to),
# so no manual URL editing is needed here.

databases:
  - name: aegis-db
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: aegis-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    envVars:
      # Auto-wired from the aegis-db resource above — no manual connection-string copying.
      - key: DATABASE_URL
        fromDatabase:
          name: aegis-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set after the Vercel frontend is deployed and its URL is known (see DEPLOYMENT.md) —
      # `sync: false` means Render prompts you for a value instead of using a default.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional — only needed if you want the LLM analyst narrative / copilot in production.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ENABLE_LLM_REASONING
        value: "false"
      - key: ENABLE_COPILOT
        value: "false"
      # Auth (M8 Stage 2). Signs/verifies JWT access tokens — must be a real, stable secret
      # in production; every restart with no explicit value invalidates all sessions (see
      # app.core.config.settings.jwt_secret_key). `sync: false` means Render prompts for a
      # value instead of using a default; set via the Render API with a value generated by
      # `python -c "import secrets; print(secrets.token_urlsafe(64))"` (see DEPLOYMENT.md).
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_TTL_DAYS
        value: "7"
