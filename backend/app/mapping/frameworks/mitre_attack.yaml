version: "1.0"
framework: "MITRE ATT&CK"
framework_key: mitre_attack
source: "https://attack.mitre.org"
controls:
  - id: T1566
    name: "Phishing"
    url: "https://attack.mitre.org/techniques/T1566/"
  - id: T1566.001
    name: "Phishing: Spearphishing Attachment"
    url: "https://attack.mitre.org/techniques/T1566/001/"
  - id: T1566.002
    name: "Phishing: Spearphishing Link"
    url: "https://attack.mitre.org/techniques/T1566/002/"
  - id: T1598
    name: "Phishing for Information"
    url: "https://attack.mitre.org/techniques/T1598/"
  - id: T1583.001
    name: "Acquire Infrastructure: Domains"
    url: "https://attack.mitre.org/techniques/T1583/001/"
  - id: T1656
    name: "Impersonation"
    url: "https://attack.mitre.org/techniques/T1656/"
  - id: T1204.002
    name: "User Execution: Malicious File"
    url: "https://attack.mitre.org/techniques/T1204/002/"

mappings:
  SENDER_REPLYTO_MISMATCH: [T1656]
  DISPLAY_NAME_EMAIL_MISMATCH: [T1656]
  LOOKALIKE_DOMAIN: [T1583.001, T1656, T1566.002]
  PUNYCODE_IDN_DOMAIN: [T1583.001, T1566.002]
  URGENCY_LANGUAGE: [T1598]
  CREDENTIAL_REQUEST: [T1598, T1566.002]
  PAYMENT_REQUEST: [T1598]
  LINK_DISPLAY_HREF_MISMATCH: [T1566.002]
  LINK_SHORTENER: [T1566.002]
  LINK_SUSPICIOUS_TLD: [T1566.002, T1583.001]
  LINK_IP_LITERAL: [T1566.002]
  ATTACHMENT_RISKY_EXTENSION: [T1566.001, T1204.002]
  ATTACHMENT_DOUBLE_EXTENSION: [T1566.001, T1204.002]
  ATTACHMENT_MACRO_ENABLED: [T1566.001, T1204.002]
  AUTH_SPF_FAIL: [T1656]
  AUTH_DKIM_FAIL: [T1656]
  AUTH_DMARC_FAIL: [T1656]
  # AI_AUTHORED_SUSPECTED is a stylometric/authorship heuristic (see
  # backend/app/indicators/ai_authored.py), not a literal MITRE technique match — there is
  # no dedicated ATT&CK technique for "the lure text was LLM-generated." It's mapped to the
  # T1566 phishing family because AI-generated fluent text is primarily used to scale and
  # polish spearphishing/phishing lures (T1566, T1566.002), which is the attacker behavior
  # this signal is corroborating evidence for.
  AI_AUTHORED_SUSPECTED: [T1566, T1566.002]
